name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - run: cargo build --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - run: cargo test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - run: cargo fmt --check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - name: Build schelk
        run: cargo build --release
      - name: Install VM dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            linux-image-generic \
            thin-provisioning-tools dmsetup e2fsprogs \
            busybox-static cpio zstd
          # Ubuntu 24.04 installs vmlinuz as 600 root:root
          sudo chmod 644 /boot/vmlinuz-*
      - name: Run QEMU integration tests
        run: ci/run-vm-tests.sh target/release/schelk
